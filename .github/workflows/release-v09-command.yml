name: Publish verified TWIN A release

on:
  workflow_run:
    workflows: ["Windows installer"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-twina-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: windows-latest
    steps:
      - name: Resolve verified installer run
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $runId = '${{ github.event.workflow_run.id }}'
            $sourceSha = '${{ github.event.workflow_run.head_sha }}'
          }
          else {
            $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow installer.yml --branch main --event push --status success --limit 1 --json databaseId,headSha | ConvertFrom-Json
            $run = @($runs) | Select-Object -First 1
            if ($null -eq $run) { throw 'No successful Windows installer run on main was found.' }
            $runId = [string]$run.databaseId
            $sourceSha = [string]$run.headSha
          }

          if ([string]::IsNullOrWhiteSpace($runId) -or [string]::IsNullOrWhiteSpace($sourceSha)) {
            throw 'Could not resolve the verified installer run and source commit.'
          }

          "SOURCE_RUN_ID=$runId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_SHA=$sourceSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Verified installer run: $runId"
          Write-Host "Verified source SHA: $sourceSha"

      - name: Checkout verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify main still matches the tested commit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --quiet
          $mainSha = (git rev-parse origin/main).Trim()
          if ($mainSha -ne $env:SOURCE_SHA) {
            throw "main moved after the verified installer run. Tested: $env:SOURCE_SHA; current main: $mainSha. The next successful installer run will publish the newer commit."
          }

      - name: Download verified installer artifact
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\release-artifact' | Out-Null
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --name 'TWIN-A-Control-Center-Installer' --dir '.\release-artifact'
          if ($LASTEXITCODE -ne 0) { throw "Could not download installer artifact from run $env:SOURCE_RUN_ID." }

      - name: Validate installer and version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content '.\frontend\package.json' -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'frontend/package.json does not contain a version.' }

          $expectedName = "TwinA-Control-Center-Setup-$version-win-x64.exe"
          $asset = Join-Path (Resolve-Path '.\release-artifact') $expectedName
          if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
            $found = (Get-ChildItem '.\release-artifact' -File | Select-Object -ExpandProperty Name) -join ', '
            throw "Expected verified installer '$expectedName' was not found. Found: $found"
          }

          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Ensure release tag points to verified source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"
          git fetch origin --tags --force --quiet

          $existingSha = git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingSha = $existingSha.Trim()
            if ($existingSha -ne $env:SOURCE_SHA) {
              throw "Release tag $tag already points to $existingSha, but the verified main commit is $env:SOURCE_SHA. Bump frontend/package.json to a new version before publishing another release."
            }
            Write-Host "Release tag $tag already points to the verified source."
          }
          else {
            git tag $tag $env:SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create local release tag $tag." }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag." }
            Write-Host "Created release tag $tag at $env:SOURCE_SHA."
          }

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:RELEASE_VERSION"

          # Do not use `gh release view` as an existence probe here. On Windows
          # PowerShell, a missing release writes to stderr and becomes a terminating
          # NativeCommandError while ErrorActionPreference is Stop.
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub Releases.' }
          $releaseExists = @($releases | Where-Object { $_.tagName -eq $tag }).Count -gt 0

          if ($releaseExists) {
            gh release upload $tag $env:RELEASE_ASSET --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update release $tag." }
          }
          else {
            # The tag is deliberately created first. GitHub's release API can then use the
            # existing tag without trying to create a tag for a commit that changes workflows.
            gh release create $tag $env:RELEASE_ASSET --repo $env:GITHUB_REPOSITORY --generate-notes --title "TWIN A Control Center $tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag." }
          }

          Write-Host "Published TWIN A Control Center $tag from verified installer run $env:SOURCE_RUN_ID."
