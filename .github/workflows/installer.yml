name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/installer.yml'
      - 'TwinAControlCenter.sln'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/installer.yml'
      - 'TwinAControlCenter.sln'
      - 'README.md'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Privacy check
        shell: powershell
        run: .\scripts\privacy-check.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $packageVersion = (Get-Content '.\frontend\package.json' -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          }
          elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $version = $packageVersion
          }
          else {
            $version = "$packageVersion-dev"
          }
          .\scripts\package-installer.ps1 -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: TWIN-A-Control-Center-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release asset
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = (Get-ChildItem 'artifacts\installer\*.exe' | Select-Object -First 1).FullName
          if (-not $asset) { throw 'Installer asset was not produced.' }

          $packageVersion = (Get-Content '.\frontend\package.json' -Raw | ConvertFrom-Json).version
          $tag = if ($env:GITHUB_REF -eq 'refs/heads/main') { "v$packageVersion" } else { $env:GITHUB_REF_NAME }

          gh release view $tag --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release upload $tag $asset --clobber
          }
          else {
            gh release create $tag $asset --target $env:GITHUB_SHA --generate-notes --title "TWIN A Control Center $tag"
          }
