name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'improve/**'
      - 'fix/**'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release-v09-command.yml'
      - 'TwinAControlCenter.sln'
      - 'README.md'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/**'
      - 'docs/**'
      - '.github/workflows/installer.yml'
      - '.github/workflows/release-v09-command.yml'
      - 'TwinAControlCenter.sln'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Privacy check
        shell: powershell
        run: .\scripts\privacy-check.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $packageVersion = (Get-Content '.\frontend\package.json' -Raw | ConvertFrom-Json).version
          $version = if ($env:GITHUB_REF -eq 'refs/heads/main') { $packageVersion } else { "$packageVersion-dev" }
          .\scripts\package-installer.ps1 -Version $version

      - name: Installer smoke test
        shell: powershell
        run: .\scripts\installer-smoke-test.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: TWIN-A-Control-Center-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14
