name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/installer-pinch-v09'
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/installer.yml'
      - 'TwinAControlCenter.sln'
      - 'README.md'

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Privacy check
        shell: powershell
        run: .\scripts\privacy-check.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.9.0-dev' }
          .\scripts\package-installer.ps1 -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWIN-A-Control-Center-Installer
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = (Get-ChildItem 'artifacts\installer\*.exe' | Select-Object -First 1).FullName
          if (-not $asset) { throw 'Installer asset was not produced.' }
          gh release create $env:GITHUB_REF_NAME $asset --generate-notes --title "TWIN A Control Center $env:GITHUB_REF_NAME"
