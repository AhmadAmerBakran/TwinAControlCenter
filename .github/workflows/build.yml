name: Windows build

on:
  push:
    branches:
      - main
      - 'improve/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Privacy check
        shell: powershell
        run: .\scripts\privacy-check.ps1
      - name: Build TWIN A
        shell: powershell
        run: .\scripts\build.ps1
