name: Normalize package lock version

on:
  push:
    branches:
      - feature/self-updater-0.9.1
    paths:
      - '.github/workflows/normalize-lock-temp.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout updater branch
        uses: actions/checkout@v6
        with:
          ref: feature/self-updater-0.9.1

      - name: Keep package-lock version in sync
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = '"version": "0.9.0"'
          new = '"version": "0.9.1"'
          if text.count(old) < 2:
              raise SystemExit('Expected the two root package-lock version fields to still be 0.9.0.')
          text = text.replace(old, new, 2)
          path.write_text(text, encoding='utf-8')

      - name: Commit normalized lockfile and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-lock-temp.yml
          git add frontend/package-lock.json
          git commit -m "Keep package lock version in sync"
          git push origin HEAD:feature/self-updater-0.9.1
