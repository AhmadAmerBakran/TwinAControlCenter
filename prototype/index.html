<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWIN A UI Preview</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app-shell"><div class="ambient ambient-blue"></div><div class="ambient ambient-white"></div>
<aside class="rail"><button class="brand-button"><img src="assets/icon-192.png"></button><nav>
<button class="nav-button active"><span class="nav-icon">⌂</span><span>Home</span></button><button class="nav-button"><span class="nav-icon">◉</span><span>Studio</span></button><button class="nav-button"><span class="nav-icon">◖</span><span>Audio</span></button><button class="nav-button"><span class="nav-icon">◇</span><span>Games</span></button><button class="nav-button"><span class="nav-icon">▣</span><span>System</span></button><button class="nav-button"><span class="nav-icon">▤</span><span>Files</span></button><button class="nav-button"><span class="nav-icon">⌘</span><span>Dev</span></button><button class="nav-button"><span class="nav-icon">⌁</span><span>IoT</span></button><button class="nav-button"><span class="nav-icon">⚡</span><span>Flows</span></button></nav></aside>
<main class="workspace"><header class="topbar glass"><div class="identity"><img class="mini-logo" src="assets/icon-192.png"><div><strong>TWIN A</strong><span>CONTROL CENTER</span></div></div><div class="status-strip"><span class="status"><i class="dot green"></i>PC</span><span class="status"><i class="dot green"></i>TAILSCALE</span><span class="status"><i class="dot green"></i>OBS</span><span class="demo-badge">LIVE</span></div><div class="record-pill live"><span class="record-dot"></span><div><small>RECORDING</small><strong>01:04:17</strong></div></div></header>
<section class="page"><div class="hero glass"><div class="hero-image"></div><div class="hero-overlay"></div><div class="hero-content"><div class="eyebrow">COMMAND DECK / LIVE SESSION</div><h1>Everything important,<br><span>one touch away.</span></h1><p>TWIN A Gameplay Session</p><div class="hero-actions"><button class="primary-action"><span>■</span> Stop recording</button><button class="secondary-action">Open studio</button></div></div></div>
<div class="grid metric-grid"><article class="metric glass"><span>CPU</span><strong>32%</strong><div class="meter"><i style="width:32%"></i></div></article><article class="metric glass"><span>GPU</span><strong>87%</strong><div class="meter"><i style="width:87%"></i></div></article><article class="metric glass"><span>RAM</span><strong>58%</strong><div class="meter"><i style="width:58%"></i></div></article><article class="metric glass"><span>GPU TEMP</span><strong>67°</strong><small>CELSIUS</small></article></div>
<div class="section-heading"><div><span class="eyebrow">QUICK ACTIONS</span><h2>Core controls</h2></div><button class="text-button">View workflows →</button></div><div class="grid action-grid">
<button class="action-card glass record"><span class="action-icon">●</span><div><strong>Stop recording</strong><small>OBS capture</small></div><b>→</b></button><button class="action-card glass"><span class="action-icon">↺</span><div><strong>Save replay</strong><small>Replay buffer</small></div><b>→</b></button><button class="action-card glass"><span class="action-icon">★</span><div><strong>Mark moment</strong><small>Timestamp editor</small></div><b>→</b></button><button class="action-card glass"><span class="action-icon">⌖</span><div><strong>Screenshot</strong><small>Capture desktop</small></div><b>→</b></button><button class="action-card glass"><span class="action-icon">◈</span><div><strong>Steam</strong><small>Launch client</small></div><b>→</b></button><button class="action-card glass"><span class="action-icon">◉</span><div><strong>Discord</strong><small>Deafen toggle</small></div><b>→</b></button></div>
</section></main></div></body></html>
